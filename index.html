  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Disparo de InitiateCheckout ao clicar em botões de compra ou checkout
      document.body.addEventListener('click', function(e) {
        var target = e.target.closest('a, button');
        if (!target) return;
        var href = target.getAttribute('href') || '';
        var isCheckoutBtn = target.classList.contains('btn-buy-completo') || 
                            target.classList.contains('btn-buy-basico') || 
                            target.classList.contains('btn-upgrade-accept') ||
                            /checkout|hotmart|kiwify|eduzz|greenn|monetizze|perfectpay/i.test(href);

        if (isCheckoutBtn && typeof window.fbq === 'function') {
          window.fbq('track', 'InitiateCheckout', {
            content_name: target.innerText ? target.innerText.trim() : 'Oferta Bordado Russo',
            currency: 'BRL',
            value: 37.90
          });
        }
      });
    });
